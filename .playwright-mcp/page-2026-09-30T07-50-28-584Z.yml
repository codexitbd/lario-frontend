        - heading "Built Around the Fire" [level=2] [ref=e196]
        - paragraph [ref=e197]: Al Narjis opened first; Al Yasmin followed four years later, built for longer, slower dinners.
      - generic [ref=e199]:
        - paragraph [ref=e200]: "La Rio started with a simple idea: put the grill at the centre of the room instead of hiding it in the back. Our kitchens draw on Argentine asado technique, Italian pasta and pizza craft, and Turkish charcoal cooking, and our cooks move between all three rather than staying fenced into one. The result is a menu that shares a fire more than it shares a single country's habits."
